name: Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' # Run nightly

# Least privilege for GITHUB_TOKEN: these jobs only read the repository.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          build_asan/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-manifest-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-manifest-v1-

    - name: Install Additional Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang libssl-dev libpq-dev

    - name: Setup vcpkg (pinned to builtin-baseline)
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        # Fetch the exact commit named by builtin-baseline in vcpkg.json.
        # Fetching "master" only works while the pin happens to be master's
        # tip; once upstream moves, the baseline commit is missing from the
        # shallow history and vcpkg fails to resolve any dependency version.
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        echo "Pinning vcpkg to builtin-baseline $BASELINE"
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics
      env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    - name: Configure CMake for Fuzzing
      run: |
        # We need to compile with Clang to use libFuzzer and ASan
        export CC=clang
        export CXX=clang++
        
        mkdir build_fuzz
        cd build_fuzz
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
              -DVCPKG_TARGET_TRIPLET=x64-linux \
              -DENABLE_FUZZING=ON \
              ..

    - name: Build Fuzz Targets
      run: |
        cd build_fuzz
        make fuzz_http_parser fuzz_http1_parser fuzz_websocket fuzz_multipart fuzz_http2 -j$(nproc)

    - name: Run fuzz targets
      # Short runs on pushes and pull requests; longer nightly.
      run: |
        SECONDS_PER_TARGET=${{ github.event_name == 'schedule' && 300 || 30 }}
        mkdir -p crashes
        status=0
        for target in fuzz_http_parser fuzz_http1_parser fuzz_websocket fuzz_multipart fuzz_http2; do
          echo "::group::$target ($SECONDS_PER_TARGET s)"
          ./build_fuzz/$target -max_total_time=$SECONDS_PER_TARGET -rss_limit_mb=2048 \
            -artifact_prefix=crashes/$target- || status=1
          echo "::endgroup::"
        done
        exit $status

    - name: Upload crashing inputs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-crashes
        path: crashes/
