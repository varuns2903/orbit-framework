name: Installer Lint

on:
  pull_request:
    paths: [ "install.sh", "install.ps1", ".github/workflows/installers.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "install.sh", "install.ps1" ]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: ShellCheck install.sh
      run: shellcheck install.sh

  powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Parse and analyze install.ps1
      shell: pwsh
      run: |
        $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
        if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
        Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
        $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
        if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
        Write-Host "install.ps1 parses and has no analyzer errors"
