name: WebSocket Conformance (Autobahn)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  autobahn:
    name: Autobahn fuzzingclient
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          build/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-manifest-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-manifest-v1-

    - name: Setup vcpkg (pinned to builtin-baseline)
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Build the echo server
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_BUILD_TYPE=Release -DORBIT_ENABLE_GRPC=OFF -DORBIT_BUILD_TESTS=OFF -DORBIT_BUILD_EXAMPLES=ON
        cmake --build build --parallel 4 --target websocket_echo_server

    # wstest's memory grows across a run and is not given back between cases:
    # over the whole suite it passes 2 GB and some CI runs were SIGKILLed in
    # section 12 (exit 137), while the echo server stayed under 100 MB. A
    # fresh wstest per section peaks under 1.8 GB. Every section is listed
    # (8 and 11 do not exist; 9 is excluded in fuzzingclient.json), and the
    # check below fails if any case went missing.
    - name: Run Autobahn against it
      run: |
        ./build/websocket_echo_server --port 9001 --log-level WARN &
        for i in $(seq 1 50); do nc -z 127.0.0.1 9001 && break; sleep 0.2; done
        mkdir -p reports/specs
        for section in 1 2 3 4 5 6 7 10 12.1 12.2 12.3 12.4 12.5 \
                       13.1 13.2 13.3 13.4 13.5 13.6 13.7; do
          python3 .github/autobahn/batch_spec.py "$section" > "reports/specs/$section.json"
          docker run --rm --network host -v "$PWD/reports:/reports" \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s "/reports/specs/$section.json"
        done

    - name: Check results
      run: python3 .github/autobahn/check_results.py --expect 427 reports/servers/*/index.json

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: autobahn-report
        path: reports/servers
