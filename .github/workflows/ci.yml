name: Orbit CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install Additional Tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind wrk

    - name: Setup vcpkg (Unix)
      if: runner.os != 'Windows'
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git
        cd vcpkg
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat -disableMetrics

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DORBIT_ENABLE_GRPC=OFF

    - name: Build Framework
      run: cmake --build build --config Release --parallel 4

    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Run Memory Leak Detection (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: valgrind --leak-check=full --error-exitcode=1 ./http_server_tests

    - name: Run Load Test (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: |
        ./basic_server &
        SERVER_PID=$!
        sleep 2
        wrk -t2 -c100 -d5s http://127.0.0.1:8080/
        kill $SERVER_PID
