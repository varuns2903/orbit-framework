# Coverage reported by .github/workflows/coverage.yml (gcovr over src/ and
# include/orbit/). The ignores guard against anything else being uploaded.
coverage:
  status:
    # Reported on pull requests, but never blocks a merge.
    project:
      default:
        # Shown against the 85% line-coverage goal (#133), never enforced.
        target: 85%
        informational: true
    patch:
      default:
        informational: true

# The headline figure is line coverage, as in docs/coverage.md. Codecov
# otherwise counts an executed line as uncovered ("partial") when any of its
# branches was not taken, and gcov reports a hidden exception-unwinding
# branch on most C++ lines that call a function: 46% on the badge for 82%
# of lines executed. Branch coverage stays in the gcovr report.
parsers:
  cobertura:
    partials_as_hits: true

ignore:
  - "tests/**"
  - "examples/**"
  - "benchmarks/**"
  - "tools/**"
  - "**/_deps/**"
  - "include/orbit/http/json.hpp"

comment:
  layout: "diff, files"
  require_changes: true
