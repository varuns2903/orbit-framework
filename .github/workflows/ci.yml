name: Orbit CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          build/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-manifest-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-manifest-v1-

    - name: Install Additional Tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind wrk

    - name: Setup vcpkg (Unix, pinned to builtin-baseline)
      if: runner.os != 'Windows'
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        # Fetch the exact commit named by builtin-baseline in vcpkg.json.
        # Fetching "master" only works while the pin happens to be master's
        # tip; once upstream moves, the baseline commit is missing from the
        # shallow history and vcpkg fails to resolve any dependency version.
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        echo "Pinning vcpkg to builtin-baseline $BASELINE"
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Setup vcpkg (Windows, pinned to builtin-baseline)
      if: runner.os == 'Windows'
      run: |
        if (!(Test-Path -Path "vcpkg")) { New-Item -ItemType Directory -Path "vcpkg" | Out-Null }
        cd vcpkg
        if (!(Test-Path -Path ".git")) {
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        }
        # Same pin as the Unix job: resolve builtin-baseline from vcpkg.json and
        # fetch that exact commit, so Windows builds are reproducible instead of
        # drifting with whatever vcpkg master happens to be that day.
        $baseline = (Get-Content -Raw ..\vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        Write-Host "Pinning vcpkg to builtin-baseline $baseline"
        git fetch --depth 1 origin $baseline
        if ($LASTEXITCODE -ne 0) { throw "failed to fetch vcpkg baseline $baseline" }
        git checkout --detach FETCH_HEAD
        .\bootstrap-vcpkg.bat -disableMetrics

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DORBIT_ENABLE_GRPC=OFF

    - name: Build Framework
      run: cmake --build build --config Release --parallel 4

    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Run Memory Leak Detection (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: valgrind --leak-check=full --error-exitcode=1 ./http_server_tests

    - name: Run Load Test (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: |
        ./basic_server &
        SERVER_PID=$!
        sleep 2
        wrk -t2 -c100 -d5s http://127.0.0.1:8080/
        kill $SERVER_PID
