name: Consumer Build

# Builds an application that pulls Orbit in with FetchContent (the way
# `orbit new --fetch` sets it up), in Debug, and runs it. Debug is where
# Orbit's own sanitizer settings used to break consumers' links (#185).
on:
  push:
    branches: [ "main" ]
    paths:
      - "CMakeLists.txt"
      - "OrbitFrameworkConfig.cmake.in"
      - "vcpkg.json"
      - "tests/consumer/**"
      - "packaging/vcpkg-port/test/**"
      - "tools/cli/**"
      - ".github/workflows/consumer.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "CMakeLists.txt"
      - "OrbitFrameworkConfig.cmake.in"
      - "vcpkg.json"
      - "tests/consumer/**"
      - "packaging/vcpkg-port/test/**"
      - "tools/cli/**"
      - ".github/workflows/consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetchcontent:
    name: FetchContent consumer (Debug, sanitizers ${{ matrix.sanitizers }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # default: what a new project gets; ON: an application that opts in.
        sanitizers: [ default, "ON" ]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          consumer/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-consumer-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-consumer-v1-

    - name: Setup vcpkg (pinned to builtin-baseline)
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics

    # VCPKG_MANIFEST_DIR: the consumer resolves Orbit's dependencies from
    # Orbit's own manifest, as a scaffolded project's vcpkg.json would.
    - name: Configure
      run: |
        extra=""
        if [ "${{ matrix.sanitizers }}" = "ON" ]; then extra="-DENABLE_SANITIZERS=ON"; fi
        cmake -B consumer -S tests/consumer \
          -DCMAKE_BUILD_TYPE=Debug \
          -DORBIT_SOURCE_DIR="$GITHUB_WORKSPACE" \
          -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE" \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          $extra

    - name: Build
      run: cmake --build consumer --parallel 4

    - name: Run
      env:
        ASAN_OPTIONS: detect_leaks=0
      run: timeout 60 ./consumer/consumer

  # What a new user does (#186): `orbit new --fetch`, then `orbit build` with
  # the generated vcpkg.json. Ubuntu ships none of llhttp, brotli, zstd or
  # liburing as CMake packages, so an incomplete manifest fails here.
  scaffold:
    name: orbit new + orbit build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: The CLI manifest matches vcpkg.json
      run: python3 tools/cli/check_manifest.py

    # Cached outside demo/: restoring into demo/build would create demo/
    # before `orbit new demo`, which then refuses an existing directory.
    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          scaffold-cache/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-scaffold-v2-${{ hashFiles('vcpkg.json', 'tools/cli/orbit') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-scaffold-v2-

    - name: Setup vcpkg (pinned to builtin-baseline)
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics

    # The scaffold fetches the released tag; point FetchContent at this
    # checkout so the job tests the code under review.
    - name: orbit new --fetch demo
      run: |
        python3 tools/cli/orbit new --fetch demo
        cat demo/vcpkg.json
        if [ -d scaffold-cache/vcpkg_installed ]; then
          mkdir -p demo/build
          mv scaffold-cache/vcpkg_installed demo/build/vcpkg_installed
        fi

    - name: orbit build (default build type)
      working-directory: demo
      env:
        CMAKE_ARGS: -DFETCHCONTENT_SOURCE_DIR_ORBITFRAMEWORK=${{ github.workspace }}
      run: |
        # orbit build has no pass-through for extra CMake flags; seed the
        # cache with the source override first, as a user trying a fix would.
        cmake -B build -S . $CMAKE_ARGS -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
        python3 ../tools/cli/orbit build --jobs 4

    - name: The scaffolded server answers
      working-directory: demo
      run: |
        ./build/demo &
        for i in $(seq 50); do curl -sf http://127.0.0.1:3000/api/status && break; sleep 0.2; done
        test "$(curl -s http://127.0.0.1:3000/)" = "Hello from Orbit Framework!"
        kill %1

    # Back where the cache step saves it from (it saves after the last step).
    - name: Keep the installed packages for the cache
      if: always()
      run: |
        if [ -d demo/build/vcpkg_installed ]; then
          mkdir -p scaffold-cache
          rm -rf scaffold-cache/vcpkg_installed
          mv demo/build/vcpkg_installed scaffold-cache/vcpkg_installed
        fi

