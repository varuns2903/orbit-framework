name: Orbit CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache vcpkg dependencies
      uses: actions/cache@v4
      with:
        path: |
          build/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-manifest-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-manifest-v1-

    - name: Install Additional Tools (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind wrk

    - name: Setup vcpkg (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 origin master
          git checkout FETCH_HEAD
        fi
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      run: |
        if (!(Test-Path -Path "vcpkg")) { New-Item -ItemType Directory -Path "vcpkg" }
        cd vcpkg
        if (!(Test-Path -Path ".git")) {
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
          git fetch --depth 1 origin master
          git checkout FETCH_HEAD
        }
        .\bootstrap-vcpkg.bat -disableMetrics

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DORBIT_ENABLE_GRPC=OFF

    - name: Build Framework
      run: cmake --build build --config Release --parallel 4

    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Run Memory Leak Detection (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: valgrind --leak-check=full --error-exitcode=1 ./http_server_tests

    - name: Run Load Test (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      working-directory: build
      run: |
        ./basic_server &
        SERVER_PID=$!
        sleep 2
        wrk -t2 -c100 -d5s http://127.0.0.1:8080/
        kill $SERVER_PID
