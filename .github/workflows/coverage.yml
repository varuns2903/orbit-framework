name: Code Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  coverage:
    name: Measure test coverage
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Cache vcpkg dependencies
      uses: actions/cache@v6
      with:
        path: |
          build_cov/vcpkg_installed
          vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-manifest-v1-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-manifest-v1-

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        pipx install gcovr || pip install --user gcovr

    - name: Setup vcpkg (pinned to builtin-baseline)
      run: |
        mkdir -p vcpkg
        cd vcpkg
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://github.com/microsoft/vcpkg.git
        fi
        BASELINE=$(python3 -c "import json; print(json.load(open('../vcpkg.json'))['builtin-baseline'])")
        echo "Pinning vcpkg to builtin-baseline $BASELINE"
        git fetch --depth 1 origin "$BASELINE"
        git checkout --detach FETCH_HEAD
        ./bootstrap-vcpkg.sh -disableMetrics

    - name: Configure with coverage instrumentation
      run: |
        cmake -B build_cov -S . \
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DORBIT_ENABLE_COVERAGE=ON \
          -DENABLE_SANITIZERS=OFF \
          -DORBIT_BUILD_EXAMPLES=OFF \
          -DORBIT_ENABLE_GRPC=OFF

    - name: Build
      run: cmake --build build_cov --parallel 4

    - name: Run tests
      working-directory: build_cov
      run: ctest --output-on-failure

    # Count only Orbit's own sources. An exclude list is the wrong tool here —
    # it silently let libstdc++ headers pulled in through templates into the
    # denominator. Allow-listing src/ and include/orbit/ is exact, and the
    # vendored nlohmann amalgamation is dropped explicitly because it lives
    # under include/orbit/ but is ~24k lines of third-party code.
    - name: Generate coverage report
      working-directory: build_cov
      run: |
        gcovr -r .. . \
          --filter "${GITHUB_WORKSPACE}/src/" \
          --filter "${GITHUB_WORKSPACE}/include/orbit/" \
          --exclude '.*json\.hpp' \
          --html-details coverage.html \
          --xml coverage.xml \
          --txt coverage.txt \
          --print-summary

    - name: Publish summary
      if: always()
      working-directory: build_cov
      run: |
        {
          echo "## Coverage"
          echo
          echo '```'
          tail -n 40 coverage.txt || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          build_cov/coverage.html
          build_cov/coverage*.html
          build_cov/coverage.xml
          build_cov/coverage.txt
        retention-days: 30
